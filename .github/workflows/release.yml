name: Release Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag $RELEASE_TAG is not a supported release tag" >&2
            exit 1
          fi

          expected_version="$(scripts/current-version.sh)"
          tagged_version="${RELEASE_TAG#v}"
          tagged_base_version="${tagged_version%%-*}"
          if [[ "$tagged_base_version" != "$expected_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match Gradle version $expected_version" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: oracle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run tests
        run: ./gradlew clean build

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: ./gradlew publishToMavenCentral -Prelease=true --no-configuration-cache --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "Namastack Outbox $RELEASE_TAG"
            --generate-notes
            --verify-tag
            --fail-on-no-commits
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${release_args[@]}"
