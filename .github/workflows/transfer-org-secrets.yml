name: Copy publishing secrets to organization

on:
  workflow_dispatch:

permissions: {}

jobs:
  transfer:
    if: github.repository == 'namastack/namastack-outbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy secrets for Outbox and Once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_TRANSFER_TOKEN }}
          GH_PROMPT_DISABLED: "1"
          ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing ORG_SECRETS_TRANSFER_TOKEN"
            exit 1
          fi

          names=(
            ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME
            ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD
            ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY
            ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID
            ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD
          )

          for name in "${names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing source secret: $name"
              exit 1
            fi
          done

          gh api /orgs/namastack/actions/secrets --silent

          for name in "${names[@]}"; do
            printf '%s' "${!name}" |
              gh secret set "$name" \
                --org namastack \
                --visibility selected \
                --repos namastack-outbox,namastack-once
          done

          expected=$(printf '%s\n' namastack/namastack-once namastack/namastack-outbox | sort)
          for name in "${names[@]}"; do
            visibility=$(gh api "/orgs/namastack/actions/secrets/$name" --jq .visibility)
            actual=$(gh api "/orgs/namastack/actions/secrets/$name/repositories" \
              --paginate --jq '.repositories[].full_name' | sort)
            if [[ "$visibility" != selected || "$actual" != "$expected" ]]; then
              echo "::error::Unexpected repository access for $name"
              exit 1
            fi
            echo "Verified organization secret and repository access: $name"
          done
