services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: outbox_metrics
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d outbox_metrics"]
      interval: 2s
      timeout: 2s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
