spring:
  application:
    name: namastack-outbox-performance-test-consumer
  datasource:
    url: ${PERF_DB_URL:jdbc:postgresql://localhost:5432/outbox_performance_test}
    username: ${PERF_DB_USER:username}
    password: ${PERF_DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${PERF_DB_POOL_SIZE:12}
      minimum-idle: ${PERF_DB_MIN_IDLE:5}
      connection-timeout: 30000
  threads:
    virtual:
      enabled: ${PERF_VIRTUAL_THREADS:true}

server:
  port: ${SERVER_PORT:9101}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      consumer: ${PERF_INSTANCE_ID:consumer-1}

namastack:
  outbox:
    jdbc:
      completion-batching:
        bulk-updates: ${PERF_BULK_COMPLETION_UPDATES:true}
        enabled: ${PERF_COMPLETION_BATCHING:true}
        max-batch-size: ${PERF_COMPLETION_BATCH_SIZE:2048}
        max-wait: ${PERF_COMPLETION_BATCH_WAIT:1ms}
        writer-count: ${PERF_COMPLETION_WRITERS:1}
      schema-initialization:
        enabled: false
    polling:
      batch-size: ${PERF_BATCH_SIZE:2000}
      trigger: fixed
      fixed:
        interval: ${PERF_POLL_INTERVAL:10ms}
    processing:
      delete-completed-records: false
      stop-on-first-failure: ${PERF_STRICT_ORDERING:true}
      executor-concurrency-limit: ${PERF_EXECUTOR_CONCURRENCY_LIMIT:2048}
      executor-core-pool-size: ${PERF_EXECUTOR_CORE_POOL_SIZE:16}
      executor-max-pool-size: ${PERF_EXECUTOR_MAX_POOL_SIZE:32}
    observability:
      metrics:
        # The collector measures database state; retain event timers without duplicate state queries.
        enabled: false
    instance:
      heartbeat-interval: 1s
      stale-instance-timeout: 10s
      rebalance-interval: 1s
    multicaster:
      enabled: false

logging:
  level:
    root: WARN
    io.namastack.outbox: WARN
