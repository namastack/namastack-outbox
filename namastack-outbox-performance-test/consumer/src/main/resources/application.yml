spring:
  main:
    keep-alive: true
  application:
    name: namastack-outbox-performance-test-consumer
  datasource:
    url: ${PERF_DB_URL:jdbc:postgresql://localhost:5432/outbox_performance_test}
    username: ${PERF_DB_USER:username}
    password: ${PERF_DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${PERF_DB_POOL_SIZE:12}
      minimum-idle: ${PERF_DB_MIN_IDLE:5}
      connection-timeout: 30000
  threads:
    virtual:
      enabled: ${PERF_VIRTUAL_THREADS:true}

namastack:
  outbox:
    jdbc:
      schema-initialization:
        enabled: false
    polling:
      batch-size: ${PERF_BATCH_SIZE:1000}
      trigger: ${PERF_POLL_TRIGGER:fixed}
      fixed:
        interval: ${PERF_POLL_INTERVAL:10ms}
      adaptive:
        min-interval: ${PERF_POLL_MIN_INTERVAL:1ms}
        max-interval: ${PERF_POLL_MAX_INTERVAL:10ms}
    processing:
      delete-completed-records: ${NAMASTACK_OUTBOX_PROCESSING_DELETECOMPLETEDRECORDS:true}
      stop-on-first-failure: ${PERF_STRICT_ORDERING:true}
      executor-concurrency-limit: ${PERF_EXECUTOR_CONCURRENCY_LIMIT:2048}
    observability:
      metrics:
        # The benchmark counts records at measurement boundaries; avoid periodic state queries.
        enabled: false
    instance:
      heartbeat-interval: 1s
      stale-instance-timeout: 10s
      rebalance-interval: 1s
    multicaster:
      enabled: false

logging:
  level:
    root: WARN
    io.namastack.outbox: WARN
