# Select one service per run. Databases and benchmark JVMs share this Docker network.
services:
  postgres:
    profiles: [postgres]
    image: ${PERF_POSTGRES_IMAGE:-postgres:17.11-alpine}
    shm_size: 1gb
    command: [postgres, -c, config_file=/etc/postgresql/benchmark.conf, -c, 'shared_buffers=${PERF_PG_SHARED_BUFFERS:-20GB}', -c, 'effective_cache_size=${PERF_PG_EFFECTIVE_CACHE_SIZE:-24GB}']
    environment:
      POSTGRES_DB: outbox_performance_test
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/benchmark.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U username -d outbox_performance_test']
      interval: 2s
      timeout: 5s
      retries: 60
  mysql:
    profiles: [mysql]
    image: ${PERF_MYSQL_IMAGE:-mysql:9.2}
    command: [--innodb-buffer-pool-size=16G, --innodb-redo-log-capacity=4G, --max-connections=256]
    environment:
      MYSQL_DATABASE: outbox_performance_test
      MYSQL_USER: username
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: benchmark-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysql -h 127.0.0.1 -uusername -ppassword -D outbox_performance_test -e "SELECT 1" >/dev/null']
      interval: 2s
      timeout: 5s
      retries: 90
  sqlserver:
    profiles: [sqlserver]
    platform: linux/amd64
    image: ${PERF_SQLSERVER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Benchmark-Password-42!'
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: '20480'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b >/dev/null']
      interval: 5s
      timeout: 10s
      retries: 90
  oracle:
    profiles: [oracle]
    image: ${PERF_ORACLE_IMAGE:-gvenzl/oracle-free:23-slim-faststart}
    environment:
      ORACLE_PASSWORD: benchmark-admin-password
      APP_USER: username
      APP_USER_PASSWORD: password
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 5s
      timeout: 10s
      retries: 90
  mariadb:
    profiles: [mariadb]
    image: ${PERF_MARIADB_IMAGE:-mariadb:11.5.2}
    command: [--innodb-buffer-pool-size=16G, --innodb-log-file-size=4G, --max-connections=256]
    environment:
      MARIADB_DATABASE: outbox_performance_test
      MARIADB_USER: username
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: benchmark-root-password
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 90
  h2:
    profiles: [h2]
    image: ${PERF_JAVA_IMAGE:-eclipse-temurin:21-jre}
    command: [java, -Xms128m, -Xmx8g, -cp, '/tooling/lib/*', org.h2.tools.Server, -tcp, -tcpAllowOthers, -ifNotExists, -baseDir, /data]
    volumes:
      - ./tooling/build/install/tooling/lib:/tooling/lib:ro
      - h2-data:/data
volumes:
  postgres-data:
  mysql-data:
  sqlserver-data:
  oracle-data:
  mariadb-data:
  h2-data:
