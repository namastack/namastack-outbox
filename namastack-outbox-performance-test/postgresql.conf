# Dedicated benchmark server. shared_buffers/effective_cache_size are set in Compose.
# Leave connection headroom for multiple consumer pools, producers and diagnostics.
max_connections = 250
work_mem = '16MB'
jit = off

# Avoid frequent WAL-buffer flushes and checkpoints at the measured write rate.
wal_buffers = '64MB'
wal_compression = lz4
max_wal_size = '32GB'
min_wal_size = '4GB'

# Reclaim dead tuples and refresh partial-index statistics promptly.
autovacuum_naptime = '10s'
autovacuum_vacuum_scale_factor = 0.02
autovacuum_vacuum_threshold = 10000
autovacuum_analyze_scale_factor = 0.01
autovacuum_analyze_threshold = 10000
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = '1ms'
bgwriter_delay = '10ms'
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4

# Keep acknowledged completions durable. These are also PostgreSQL defaults.
fsync = on
full_page_writes = on
synchronous_commit = on

# Required by the container image when a custom config file is used.
listen_addresses = '*'
